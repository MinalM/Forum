# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]
        mongodb-version: ['6.0']

    services:
      mongodb:
        image: mongo:${{ matrix.mongodb-version }}
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          client/package-lock.json
          
    - name: Install dependencies
      run: npm run ci
      
    - name: Install Playwright Browsers
      run: |
        npx playwright install chromium
        npx playwright install-deps chromium
      
    - name: Build the app
      run: CI=false npm run build --if-present
      
    - name: Run unit tests
      run: npm test
      env:
        MONGO_URI: mongodb://localhost:27017/ai_ml_forum_test

    - name: Generate and run seed script
      run: |
        node scripts/generate-seed.js
        mongosh mongodb://localhost:27017/ai_ml_forum -f scripts/seed-mongo.js --quiet
      
    - name: Start Server
      run: npm run server & # Run in background
      env:
        MONGO_URI: mongodb://localhost:27017/ai_ml_forum
      
    - name: Start Client  
      run: npm run client & # Run in background
      
    - name: Wait for services
      run: |
        sleep 30 # Give time for server/client to initialize
      
    - name: Run Playwright tests
      run: npx playwright test
      env:
        MONGO_URI: mongodb://localhost:27017/ai_ml_forum
      
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
