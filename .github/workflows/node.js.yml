# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]
        mongodb-version: ['6.0']

    services:
      mongodb:
        image: mongo:${{ matrix.mongodb-version }}
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          client/package-lock.json
          
    - name: Install dependencies
      run: npm run ci
      
    - name: Install Playwright Browsers
      run: |
        npx playwright install chromium
        npx playwright install-deps chromium
      
    - name: Build the app
      run: |
        echo "REACT_APP_API_URL=http://localhost:5000" > client/.env
        CI=false npm run build --if-present
      
    - name: Run unit tests
      run: npm test
      env:
        MONGO_URI: mongodb://localhost:27017/ai_ml_forum_test
        JWT_SECRET: test-jwt-secret
        JWT_EXPIRE: 1h
        JWT_COOKIE_EXPIRE: 1
        NODE_ENV: development

    - name: Install MongoDB Shell
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg
        wget -qO - https://www.mongodb.org/static/pgp/server-6.0.asc | sudo apt-key add -
        echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/6.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-6.0.list
        sudo apt-get update
        sudo apt-get install -y mongodb-mongosh

    - name: Generate and run seed script
      run: |
        node scripts/generate-seed.js
        mongosh mongodb://localhost:27017/ai_ml_forum -f scripts/seed-mongo.js --quiet
      
    - name: Start Server
      run: npm run server & # Run in background
      env:
        MONGO_URI: mongodb://localhost:27017/ai_ml_forum
        JWT_SECRET: test-jwt-secret
        JWT_EXPIRE: 1h
        JWT_COOKIE_EXPIRE: 1
        NODE_ENV: development
        PORT: 5000
      
    - name: Start Client  
      run: npm run client & # Run in background
      env:
        REACT_APP_API_URL: http://localhost:5000
        PORT: 3000
      
    - name: Wait for services
      run: |
        echo "Waiting for services to start..."
        timeout 30 bash -c 'until curl -s http://localhost:5000/api/health; do sleep 1; done'
        timeout 30 bash -c 'until curl -s http://localhost:3000; do sleep 1; done'
        echo "Services are up!"
      
    - name: Run Playwright tests
      run: npx playwright test
      env:
        MONGO_URI: mongodb://localhost:27017/ai_ml_forum
        JWT_SECRET: test-jwt-secret
        JWT_EXPIRE: 1h
        JWT_COOKIE_EXPIRE: 1
        NODE_ENV: development
        PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
      
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
