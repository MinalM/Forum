services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb-dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ai_ml_forum
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ai_ml_forum --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:

